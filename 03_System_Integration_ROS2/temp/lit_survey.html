<!DOCTYPE html>
<!--

-->

<title>Literature Survey — UAV-UGV Cooperative Tracking</title>
<style>
  :root{
    --bg:#fafaf8; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280;

  /* ---- filters ---- */
  .filters{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px 16px;margin-bottom:16px;display:grid;gap:14px}
  .frow{display:flex;flex-wrap:wrap;gap:20px 22px;align-items:flex-start}

  input[type=text],input[type=number]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}

  input[type=number]{width:78px}

  .chips{display:flex;flex-wrap:wrap;gap:6px;max-width:760px}

  .chip[aria-pressed="false"]{opacity:.55}
  .chip.tagchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .dd{position:relative}
  .dd>button{font:inherit;padding:7px 11px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);cursor:pointer}
  .dd>button .car{color:var(--muted);margin-left:6px;font-size:10px}
  .dd .panel{position:absolute;z-index:30;top:calc(100% + 5px);left:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;min-width:250px;max-height:320px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.08)}
  .dd .panel.hidden{display:none}
  .dd .panel .pbar{display:flex;gap:14px;margin:0 2px 8px;border-bottom:1px solid var(--line2);padding-bottom:8px}
  .dd .panel .pbar button{font:inherit;font-size:12px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}
  .dd .panel label{display:flex;gap:8px;align-items:center;padding:3px 2px;font-size:13px;cursor:pointer}

  .reset{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#3a3f45;cursor:pointer;align-self:flex-end}

  /* ---- toolbar ---- */

  .count b{color:var(--ink)}
  .toolbar .exp{font:inherit;font-size:12.5px;background:none;border:none;color:var(--accent);cursor:pointer;padding:0}

  /* ---- table ---- */
  .tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
  table{border-collapse:collapse;width:100%;min-width:1120px;font-size:13px}
  thead th{position:sticky;top:0;background:#f3f3f0;border-bottom:1px solid var(--line);text-align:left;padding:9px 12px;font-weight:600;font-size:11.5px;color:#3a3f45;cursor:pointer;white-space:nowrap}
  thead th:hover{background:#ededea}
  thead th .ind{color:var(--accent);margin-left:5px;font-size:9px}
  tbody td{border-bottom:1px solid var(--line2);padding:10px 12px;vertical-align:top}
  tbody tr:hover{background:#fbfbf8}
  td.name{font-weight:550;min-width:220px;max-width:330px}
  td.year{text-align:right;font-variant-numeric:tabular-nums;color:#3a3f45;white-space:nowrap}
  td.venue{white-space:nowrap;color:#3a3f45}
  td.remarks{min-width:340px;max-width:540px}
  td.link{min-width:140px;max-width:200px;word-break:break-word}

  .topicchip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:5px;border:1px solid transparent;white-space:nowrap}

  .rel{display:flex;align-items:center;gap:8px;min-width:84px}
  .rel-num{font-weight:700;width:16px;text-align:right;font-variant-numeric:tabular-nums}
  .rel-track{flex:1;height:6px;background:#ececea;border-radius:3px;overflow:hidden;min-width:42px}
  .rel-fill{height:100%;display:block;border-radius:3px}

  .badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.02em;padding:2px 7px;border-radius:4px;margin:0 4px 4px 0;border:1px solid transparent;white-space:nowrap}
  .badge.lineage{background:#dde9fc;color:#14457f;border-color:#bcd4f5}
  .badge.baseline{background:#def0e1;color:#1c6b2c;border-color:#bbe1c2}
  .badge.other{background:#ececec;color:#555;border-color:#dcdcdc}

  .rmk-pt{margin:0 0 4px}
  .rmk:not(.expanded) .rmk-pt.hide{display:none}
  .rmk-toggle{margin-top:1px;background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:12px;padding:0}

  td.link a{color:var(--accent);text-decoration:none}
  td.link a:hover{text-decoration:underline}
  td.link .plain{color:#9aa0a6}

  .empty{padding:28px 14px;text-align:center;color:var(--muted)}

  a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:640px){ input.search{min-width:0} .wrap{padding:18px 14px 56px} }
</style>

<body>
<div class="wrap">
  <header class="page">
    <h1>Literature Survey Browser</h1>
    <p class="desc">Browse and filter prior art by topic, relevance, venue, year, and tags.</p>
    <p class="src">Literature survey for ICC 2026 paper — UAV-UGV Cooperative Tracking</p>
  </header>

  <section class="filters" aria-label="Filters">
    <div class="frow">
      <div class="fgroup" style="flex:1;min-width:260px">
        <span class="h">Search (title + remarks)</span>
        <input type="text" id="search" class="search" placeholder="e.g. tube MPC, observability, FoV, ColAG…" autocomplete="off">
      </div>
      <div class="fgroup">
        <span class="h">Venue</span>
        <div class="dd" id="venueDD">
          <button type="button" id="venueBtn" aria-expanded="false">All venues<span class="car">▾</span></button>
          <div class="panel hidden" id="venuePanel">
            <div class="pbar"><button type="button" data-act="all">Select all</button><button type="button" data-act="clear">Clear</button></div>
            <div id="venueList"></div>
          </div>
        </div>
      </div>
      <div class="fgroup">
        <span class="h">Year</span>
        <div class="inline">
          <input type="number" id="yearMin" inputmode="numeric"><span class="dash">–</span><input type="number" id="yearMax" inputmode="numeric">
        </div>
      </div>
      <div class="fgroup">
        <span class="h">Min relevance: <span id="relVal">1</span></span>
        <input type="range" id="relMin" min="1" max="10" step="1" value="1" style="width:170px">
      </div>
      <button type="button" class="reset" id="reset">Reset filters</button>
    </div>

    <div class="frow">
      <div class="fgroup" style="flex:1">
        <span class="h">Topic</span>
        <div class="chips" id="topicChips"></div>
      </div>
      <div class="fgroup">
        <span class="h">Tags</span>
        <div class="chips" id="tagChips"></div>
      </div>
    </div>
  </section>

  <div class="toolbar">
    <div class="count" id="count"></div>
    <button type="button" class="exp" id="expAll">Expand all remarks</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr id="head"></tr>
      </thead>
      <tbody id="body"></tbody>
    </table>
  </div>
</div>

<script>
/* ============================ DATA ============================ */
const PAPERS = [
  // --- 1. UAV-UGV Cooperative Systems ---
  {id:1, name:"Aerial Vision Based Guidance and Control for Perception-Less Ground Vehicle", topic:"UAV-UGV Cooperative Systems", venue:"ECC", year:2024, relevance:10, link:"IEEE Xplore, ECC 2024, pp. 2780–2785", tags:["LINEAGE","BASELINE CANDIDATE"], remarks:[
    `1. The baseline we extend — its conclusion is our problem statement (UAV controller that keeps both path and UGV in FoV).`,
    `2. Borrow nothing structurally except the perception-less paradigm and image-plane error setup; we replace line-fitting→heatmap, SMC→belief-MPC, fixed-2 m UAV→adaptive-altitude tube-MPC.`,
    `3. Belongs in intro (sentence 1 of contributions) and as the explicit "Future work" quote.`,
    `4. Baseline candidate — reimplement their fractional-order SMC.`]},
  {id:2, name:"ColAG: A Collaborative Air-Ground Framework for Perception-Limited UGVs' Navigation", topic:"UAV-UGV Cooperative Systems", venue:"ICRA", year:2024, relevance:9, link:"arXiv:2310.13324", tags:["LINEAGE"], remarks:[
    `1. Closest contemporary work — a perceptive UAV guides "blind" UGVs; nearly identical framing to ours.`,
    `2. Key differentiator to claim: ColAG uses LiDAR-SLAM + map-sharing + VRPTW waypoint scheduling, not vision-only image-plane control and not a differentiable FoV/view-quality objective — so the UAV reacts to requested help rather than proactively maximizing visibility.`,
    `3. Their UGV is "blind to obstacles" but still odometry-capable; ours is fully perception-less and controlled in the image plane.`,
    `4. Cite prominently in intro + related work as the must-address recent baseline.`]},
  {id:3, name:"A Nature-Inspired Distributed Robust Control Design for Ground-Aerial Vehicle Cooperation", topic:"UAV-UGV Cooperative Systems", venue:"IEEE T-ITS", year:2023, relevance:6, link:"DOI [verify] — T-ITS 24:4454–4463", tags:[], remarks:[
    `1. Distributed robust controller for aerial-ground tracking of moving targets — contrast: we co-design estimation + control with observability awareness, not just robust tracking.`,
    `2. Useful for the "heterogeneous cooperation" framing in the intro.`,
    `3. (ECC ref [3].)`]},
  {id:4, name:"UAV/UGV Autonomous Cooperation: UAV Assists UGV to Climb a Cliff by Attaching a Tether", topic:"UAV-UGV Cooperative Systems", venue:"ICRA", year:2019, relevance:4, link:"ICRA 2019, pp. 8041–8047", tags:[], remarks:[
    `1. Canonical "UAV augments UGV capability" example; physical-assistance flavor, not perception.`,
    `2. One-line related-work citation to show breadth of cooperation modes.`,
    `3. (ECC ref [1].)`]},
  {id:5, name:"AgriColMap: Aerial-Ground Collaborative 3D Mapping for Precision Farming", topic:"UAV-UGV Cooperative Systems", venue:"IEEE RA-L", year:2019, relevance:4, link:"DOI [verify] — RA-L 4(2):1085–1092", tags:[], remarks:[
    `1. Aerial-ground collaborative mapping; the UAV provides the "third-person" map.`,
    `2. Cite as application-breadth; contrast that we close the loop into real-time control, not offline mapping.`,
    `3. (ECC ref [5].)`]},
  {id:6, name:"Aerial-Ground Collaborative Sensing: Third-Person View for Teleoperation", topic:"UAV-UGV Cooperative Systems", venue:"IEEE SSRR", year:2018, relevance:4, link:"SSRR 2018, pp. 1–7", tags:[], remarks:[
    `1. Establishes the "UAV gives UGV an external viewpoint" idea our perception-less paradigm depends on.`,
    `2. Single related-work citation.`,
    `3. (ECC ref [6].)`]},
  {id:7, name:"Motion Planning for Heterogeneous Unmanned Systems under Partial Observation from UAV", topic:"UAV-UGV Cooperative Systems", venue:"IROS", year:2020, relevance:5, link:"IROS 2020, pp. 1474–1479", tags:[], remarks:[
    `1. UAV-as-partial-sensor for UGV motion planning — bridges cooperative systems and active perception.`,
    `2. Contrast: theirs is learning-based; ours is explicitly model-based (good "in contrast to [X]" sentence).`,
    `3. (ECC ref [13].)`]},
  {id:8, name:"A Comprehensive Review of UAV-UGV Collaboration: Advancements and Challenges", topic:"UAV-UGV Cooperative Systems", venue:"JSAN", year:2024, relevance:5, link:"DOI 10.3390/jsan13060081", tags:[], remarks:[
    `1. Recent survey — use as the single "for a broad overview, see [X]" citation in the intro.`,
    `2. Lets you compress the cooperation-modes paragraph.`,
    `3. MDPI venue — cite as a survey, not a technical baseline.`]},

  // --- 2. Vision-Based Ground-Robot Control ---
  {id:9, name:"Visual Servo Control of an Unmanned Ground Vehicle via a Moving Airborne Monocular Camera", topic:"Vision-Based Ground-Robot Control", venue:"ACC", year:2006, relevance:7, link:"ACC 2006 — DOI [verify]", tags:["LINEAGE","BASELINE CANDIDATE"], remarks:[
    `1. The original "moving airborne camera controls a UGV" reference — direct ancestor of the whole paradigm.`,
    `2. Borrow: their moving-camera image-Jacobian framing motivates our view-quality-coupled measurement model.`,
    `3. Flag: moving camera (unlike the overhead-camera works).`,
    `4. Cite as foundation, then claim our adaptive-altitude + FoV-coupled extension.`,
    `5. (ECC ref [11].)`]},
  {id:10, name:"Calibration-Free Image-Based Trajectory Tracking Control of Mobile Robots with an Overhead Camera", topic:"Vision-Based Ground-Robot Control", venue:"IEEE T-ASE", year:2020, relevance:7, link:"DOI [verify] — T-ASE 17:933–946", tags:["BASELINE CANDIDATE"], remarks:[
    `1. Strong image-plane control template; stationary overhead camera (flag the contrast — ours is a moving UAV).`,
    `2. Borrow: their calibration-free image-plane error formulation is a clean comparison point for our pixel-distance-scaled EKF.`,
    `3. Baseline candidate if reimplementable in the image plane.`,
    `4. (ECC ref [12].)`]},
  {id:11, name:"Automatic Generation and Detection of Highly Reliable Fiducial Markers under Occlusion (ArUco)", topic:"Vision-Based Ground-Robot Control", venue:"Pattern Recognition", year:2014, relevance:6, link:"DOI 10.1016/j.patcog.2014.01.005", tags:[], remarks:[
    `1. The ArUco citation — both ECC and we use it for UGV pose in the image.`,
    `2. Belongs in the vision-module / method section.`,
    `3. Note their occlusion handling is relevant to your FoV-periphery degradation argument.`]},
  {id:12, name:"A Visual Servoing Approach for Road Lane Following with Obstacle Avoidance", topic:"Vision-Based Ground-Robot Control", venue:"IEEE ITSC", year:2014, relevance:4, link:"ITSC 2014, pp. 412–417", tags:[], remarks:[
    `1. Image-plane lane following but with the camera onboard the ground vehicle — the exact case the perception-less paradigm removes.`,
    `2. Cite as the "prior image-plane lane work assumes onboard sensing" contrast.`,
    `3. (ECC ref [15].)`]},

  // --- 3. Observability-Aware / Active Perception ---
  {id:13, name:"Belief Space Planning Assuming Maximum Likelihood Observations", topic:"Observability-Aware / Active Perception", venue:"RSS", year:2010, relevance:8, link:"RSS 2010, pp. 587–593", tags:[], remarks:[
    `1. Seminal belief-space planning reference — cite as the origin of "plan in belief space."`,
    `2. Borrow conceptually: their ML-observation assumption justifies treating your EKF covariance as a deterministic, optimizable quantity inside MPC.`,
    `3. Belongs at the top of your related-work "perception-in-the-loop" paragraph.`]},
  {id:14, name:"Motion Planning under Uncertainty using Iterative Local Optimization in Belief Space", topic:"Observability-Aware / Active Perception", venue:"IJRR", year:2012, relevance:7, link:"IJRR 31(11):1263–1278 — DOI [verify]", tags:[], remarks:[
    `1. Optimization-in-belief-space (iLQG-style) — the methodological lineage for your uncertainty-penalized MPC cost.`,
    `2. Borrow: covariance-as-cost formulation maps directly onto your EKF-uncertainty penalty term.`,
    `3. Related work / method motivation.`]},
  {id:15, name:"The Belief Roadmap: Efficient Planning in Belief Space by Factoring the Covariance", topic:"Observability-Aware / Active Perception", venue:"IJRR", year:2009, relevance:6, link:"IJRR 28(11-12):1448–1465 — DOI [verify]", tags:[], remarks:[
    `1. Classic covariance-propagation-in-planning reference.`,
    `2. Cite alongside Platt and van den Berg as the belief-space triad; supports "estimation quality is a planning objective."`,
    `3. Footnote / grouped citation.`]},
  {id:16, name:"Towards Planning in Generalized Belief Space", topic:"Observability-Aware / Active Perception", venue:"ISRR", year:2013, relevance:5, link:"ISRR 2013 — DOI [verify]", tags:[], remarks:[
    `1. Generalizes belief-space planning beyond Gaussian / single-robot; good for the "co-design of estimation and control" sentence.`,
    `2. Grouped citation with the belief-space works.`]},
  {id:17, name:"Perception-Aware Path Planning", topic:"Observability-Aware / Active Perception", venue:"arXiv", year:2016, relevance:7, link:"arXiv:1605.04151", tags:[], remarks:[
    `1. Conceptual sibling: they visualize localization uncertainty as a heat-map over the workspace — a strong rhetorical hook for your distance-transform heatmap (note the difference: theirs is localization-info, yours is path-belief).`,
    `2. Borrow the "plan toward high-information regions" framing for the view-quality climb behavior.`,
    `3. arXiv preprint — flag venue.`]},
  {id:18, name:"Perception-Aware Receding Horizon Navigation for MAVs", topic:"Observability-Aware / Active Perception", venue:"ICRA", year:2018, relevance:6, link:"ICRA 2018, pp. 2534–2541 — DOI [verify]", tags:[], remarks:[
    `1. Receding-horizon (MPC-style) perception-aware navigation for aerial robots — closest to your high-level event-triggered MPC's spirit.`,
    `2. Borrow: their visibility / feature-richness objective is a precedent for your differentiable q(d) view-quality metric.`,
    `3. Related work + method.`]},
  {id:19, name:"Motion- and Uncertainty-Aware Path Planning for Micro Aerial Vehicles", topic:"Observability-Aware / Active Perception", venue:"J. Field Robotics", year:2014, relevance:5, link:"JFR 31(4):676–698 — DOI [verify]", tags:[], remarks:[
    `1. Early uncertainty-aware planning on a real MAV; supports "uncertainty-aware planning is established for UAVs."`,
    `2. Grouped citation; contrast that we couple UGV and UAV uncertainty bidirectionally.`]},

  // --- 4. Field-of-View Constraints ---
  {id:20, name:"PAMPC: Perception-Aware Model Predictive Control for Quadrotors", topic:"Field-of-View Constraints", venue:"IROS", year:2018, relevance:9, link:"DOI 10.1109/IROS.2018.8593739", tags:["LINEAGE"], remarks:[
    `1. The structural template for your high-level UAV MPC — unifies action + perception in one MPC, maximizing visibility of a point of interest and minimizing its image-plane velocity.`,
    `2. Borrow directly: their "keep POI centered" objective is the parent of your q(d)=σ(·)·exp(−d²/2σ²) view-quality term.`,
    `3. Differentiate: PAMPC is fixed-altitude single-agent; you add adaptive altitude + a bidirectional UGV that also cooperates to stay visible + tube robustness.`,
    `4. Cite prominently in contributions.`]},
  {id:21, name:"Vision-Based Reactive Planning for Aggressive Target Tracking While Avoiding Collisions and Occlusions", topic:"Field-of-View Constraints", venue:"IEEE RA-L", year:2018, relevance:8, link:"DOI 10.1109/LRA.2018.2856526", tags:[], remarks:[
    `1. FoV + occlusion as explicit constraints in an MPC-style online replanner (NLP/SQP at 30 Hz) — the formal "keep target in frame" precedent.`,
    `2. Borrow: their occlusion/FoV constraint structure as a comparison for your FoV penalty (you use a soft cost; they use hard constraints — discuss the tradeoff).`,
    `3. Method + related work.`]},
  {id:22, name:"Autonomous Flight for Detection, Localization, and Tracking of Moving Targets with a Small Quadrotor", topic:"Field-of-View Constraints", venue:"IEEE RA-L", year:2017, relevance:6, link:"RA-L 2(3):1762–1769 — DOI [verify]", tags:[], remarks:[
    `1. UAV tracking a moving ground target where losing it is failure — the same failure mode you formalize.`,
    `2. Contrast: no observability-coupled estimator; cite as motivation that "visibility loss is the dominant failure."`,
    `3. Related work.`]},
  {id:23, name:"A Perception-Aware Flatness-Based Model Predictive Controller for Fast Vision-Based Multirotor Flight", topic:"Field-of-View Constraints", venue:"IFAC-PapersOnLine", year:2020, relevance:6, link:"IFAC 53(2):9412–9419 — DOI [verify]", tags:[], remarks:[
    `1. Non-learning, flatness-based perception-aware MPC — directly supports your "model-based, not RL" stance.`,
    `2. Borrow: differential-flatness handling of the perception objective is an alternative to your direct NMPC; worth a sentence comparing solve-time (your ~16 ms claim).`,
    `3. Method / discussion.`]},
  {id:24, name:"A Control Barrier Function Candidate for Quadrotors with Limited Field of View", topic:"Field-of-View Constraints", venue:"arXiv", year:2024, relevance:5, link:"arXiv:2410.01277", tags:[], remarks:[
    `1. Formalizes FoV as a control-barrier-function / forward-invariant safe set with unreliable distance — exactly your "stay visible" guarantee, but as a hard CBF vs your soft MPC penalty.`,
    `2. Borrow the CBF formulation as a discussion point ("a hard-constraint alternative to our penalty; we choose soft for feasibility under aggressive curvature").`,
    `3. arXiv preprint — flag; a published CBF-FoV visual-servoing chapter also exists if you prefer peer-reviewed.`]},

  // --- 5. Tube / Event-Triggered MPC ---
  {id:25, name:"Dynamic Event-Triggered Robust Model Predictive Control for Quadrotor Trajectory Tracking", topic:"Tube / Event-Triggered MPC", venue:"Int. J. Robust & Nonlinear Control", year:2026, relevance:8, link:"DOI 10.1002/rnc.70351", tags:["LINEAGE"], remarks:[
    `1. Almost your exact low-level recipe: tube-based robust MPC + event-triggered solving on a quadrotor under bounded disturbance — the single best "we are not alone, but we differ" citation for your 20 Hz Tube-MPC ancillary tracker.`,
    `2. Differentiate: their trigger is a worst-case-disturbance threshold; yours is a 4-level perception-coupled trigger (tube exit, uncertainty spike, anticipated curvature, drift).`,
    `3. Cite in method to justify the architecture, then claim the perception-driven trigger as novel.`]},
  {id:26, name:"Linear vs Nonlinear MPC for Trajectory Tracking Applied to Rotary Wing Micro Aerial Vehicles", topic:"Tube / Event-Triggered MPC", venue:"IFAC-PapersOnLine", year:2017, relevance:6, link:"DOI 10.1016/j.ifacol.2017.08.849", tags:[], remarks:[
    `1. Canonical MAV MPC reference (with open-source ETH impl.) — grounds your choice of NMPC and the LMPC/NMPC tradeoff.`,
    `2. Borrow / compare: their solve-time numbers are a fair benchmark for your ~16 ms claim.`,
    `3. Method / experimental framing.`]},
  {id:27, name:"PCMPC: Perception-Constrained Model Predictive Control for Quadrotors with Suspended Loads using a Single Camera and IMU", topic:"Tube / Event-Triggered MPC", venue:"ICRA", year:2021, relevance:6, link:"ICRA 2021, pp. 2012–2018 — DOI [verify]", tags:[], remarks:[
    `1. Vision-coupled MPC with explicit perception constraints on a quadrotor — fits this section's "vision-coupled" inclusion criterion.`,
    `2. Borrow: their perception-constraint encoding as a comparison to your FoV-coupled tube.`,
    `3. Related work / method.`]},
  {id:28, name:"A Scalable Distributed Collision Avoidance Scheme for Multi-Agent UAV Systems", topic:"Tube / Event-Triggered MPC", venue:"IROS", year:2021, relevance:5, link:"arXiv:2104.03783 (IROS 2021)", tags:[], remarks:[
    `1. The multi-agent MPC anchor — distributed NMPC where agents share predicted trajectories.`,
    `2. Use for the "MPC scales to multi-agent coordination" sentence; contrast that your two agents (UAV+UGV) are heterogeneous and bidirectionally observability-coupled, not homogeneous deconfliction.`,

/* Topic display order + color tokens (bg / text / border). */
const TOPIC_ORDER = [
  "UAV-UGV Cooperative Systems",
  "Vision-Based Ground-Robot Control",
  "Observability-Aware / Active Perception",
  "Field-of-View Constraints",
  "Tube / Event-Triggered MPC",
  "MPC & Classical Baselines",
  "Heatmap / Distance-Transform / Cost-Maps"
];
const TOPIC_STYLE = {
  "UAV-UGV Cooperative Systems":            {bg:"#e8f0fe", fg:"#1a4480", bd:"#c5d9f7"},
  "Vision-Based Ground-Robot Control":      {bg:"#e4f5f3", fg:"#0f5e57", bd:"#bfe6e1"},
  "Observability-Aware / Active Perception":{bg:"#f0e9fb", fg:"#5b2a91", bd:"#ddc9f3"},
  "Field-of-View Constraints":              {bg:"#fdeede", fg:"#9a5300", bd:"#f7d8b0"},
  "Tube / Event-Triggered MPC":             {bg:"#fdeaec", fg:"#9a1f33", bd:"#f6c6cd"},
  "MPC & Classical Baselines":              {bg:"#e8f6ea", fg:"#1f6b2e", bd:"#c6e8cc"},
  "Heatmap / Distance-Transform / Cost-Maps":{bg:"#f6efe2", fg:"#6b4e1f", bd:"#e8d8b8"}
};

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

const ALL_VENUES = [...new Set(PAPERS.map(p=>p.venue))].sort((a,b)=>a.toLowerCase().localeCompare(b.toLowerCase()));
const ALL_TAGS = [...new Set(PAPERS.flatMap(p=>p.tags))].sort((a,b)=> (a==="LINEAGE"?0:a==="BASELINE CANDIDATE"?1:2) - (b==="LINEAGE"?0:b==="BASELINE CANDIDATE"?1:2));
const YEARS = PAPERS.map(p=>p.year);
const YMIN = Math.min(...YEARS), YMAX = Math.max(...YEARS);

function relColor(r){ return r>=8 ? "#1b6e3b" : r>=5 ? "#b07d12" : "#8a9098"; }

function linkCell(link){
  const arx = link.match(/arXiv:\s*(\d{4}\.\d{4,5})/i);
  if(arx) return {href:"https://arxiv.org/abs/"+arx[1], text:link};
  if(/\[verify\]/i.test(link)) return {href:null, text:link};
  const doi = link.match(/\b(10\.\d{4,9}\/[^\s)]+)/);
  if(doi) return {href:"https://doi.org/"+doi[1], text:link};
  if(/^https?:\/\//i.test(link)) return {href:link, text:link};
  if(/theoryofcomputing\.org/i.test(link)) return {href:"https://"+link.replace(/^https?:\/\//,""), text:link};
  return {href:null, text:link};
}
function tagClass(t){ return t==="LINEAGE" ? "lineage" : t==="BASELINE CANDIDATE" ? "baseline" : "other"; }

/* ============================ STATE ============================ */
const state = {
  search:"",
  topics:new Set(TOPIC_ORDER),
  venues:new Set(ALL_VENUES),
  tags:new Set(),            // empty = no tag restriction
  yMin:YMIN, yMax:YMAX,
  relMin:1,
  sortKey:"relevance", sortDir:"desc",
  expanded:new Set()
};

/* ============================ BUILD CONTROLS ============================ */
const COLS = [
  {key:"relevance", label:"Rel."},
  {key:"name", label:"Name"},
  {key:"topic", label:"Topic"},
  {key:"venue", label:"Venue"},
  {key:"year", label:"Year"},
  {key:"tags", label:"Tags"},
  {key:"remarks", label:"Remarks"},
  {key:"link", label:"Link"}
];

function buildHead(){
  const tr = $("#head"); tr.innerHTML="";
  COLS.forEach(c=>{
    const th=document.createElement("th");
    th.dataset.key=c.key;
    th.innerHTML = esc(c.label) + (state.sortKey===c.key ? `<span class="ind">${state.sortDir==="asc"?"▲":"▼"}</span>` : `<span class="ind" style="visibility:hidden">▼</span>`);
    th.addEventListener("click",()=>onSort(c.key));
    tr.appendChild(th);
  });
}

function buildTopicChips(){
  const box=$("#topicChips"); box.innerHTML="";
  TOPIC_ORDER.forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip topicchip"; b.textContent=t;
    const sel = state.topics.has(t);
    b.setAttribute("aria-pressed", sel?"true":"false");
    const st=TOPIC_STYLE[t];
    if(sel){ b.style.background=st.bg; b.style.color=st.fg; b.style.borderColor=st.bd; }
    b.addEventListener("click",()=>{
      if(state.topics.has(t)) state.topics.delete(t); else state.topics.add(t);
      buildTopicChips(); render();
    });
    box.appendChild(b);
  });
}

function buildTagChips(){
  const box=$("#tagChips"); box.innerHTML="";
  if(ALL_TAGS.length===0){ box.innerHTML='<span style="font-size:12px;color:#9aa0a6">none</span>'; return; }
  ALL_TAGS.forEach(t=>{
    const b=document.createElement("button");
    b.type="button"; b.className="chip tagchip"; b.textContent=t;
    b.setAttribute("aria-pressed", state.tags.has(t)?"true":"false");
    b.addEventListener("click",()=>{
      if(state.tags.has(t)) state.tags.delete(t); else state.tags.add(t);
      buildTagChips(); render();
    });
    box.appendChild(b);
  });
}

function buildVenueList(){
  const list=$("#venueList"); list.innerHTML="";
  ALL_VENUES.forEach(v=>{
    const lab=document.createElement("label");
    const cb=document.createElement("input");
    cb.type="checkbox"; cb.checked=state.venues.has(v);
    cb.addEventListener("change",()=>{
      if(cb.checked) state.venues.add(v); else state.venues.delete(v);
      updateVenueBtn(); render();
    });
    lab.appendChild(cb);
    lab.appendChild(document.createTextNode(" "+v));
    list.appendChild(lab);
  });
  updateVenueBtn();
}
function updateVenueBtn(){
  const n=state.venues.size, total=ALL_VENUES.length;
  $("#venueBtn").firstChild.textContent = n===total ? "All venues" : (n===0 ? "No venues" : n+" venue"+(n>1?"s":""));
}

/* venue dropdown open/close */
$("#venueBtn").addEventListener("click",e=>{
  e.stopPropagation();
  const p=$("#venuePanel"); const open=p.classList.toggle("hidden")===false;
  $("#venueBtn").setAttribute("aria-expanded", open?"true":"false");
});
$("#venuePanel").addEventListener("click",e=>e.stopPropagation());
$("#venuePanel").querySelectorAll(".pbar button").forEach(btn=>{
  btn.addEventListener("click",()=>{
    if(btn.dataset.act==="all") state.venues=new Set(ALL_VENUES); else state.venues=new Set();
    buildVenueList(); render();
  });
});
document.addEventListener("click",()=>{
  const p=$("#venuePanel");
  if(!p.classList.contains("hidden")){ p.classList.add("hidden"); $("#venueBtn").setAttribute("aria-expanded","false"); }
});

/* ============================ FILTER / SORT / RENDER ============================ */
function passes(p){
  if(state.search){
    const hay=(p.name+" "+p.remarks.join(" ")).toLowerCase();
    if(!hay.includes(state.search)) return false;
  }
  if(!state.topics.has(p.topic)) return false;
  if(!state.venues.has(p.venue)) return false;
  if(p.year<state.yMin || p.year>state.yMax) return false;
  if(p.relevance<state.relMin) return false;
  if(state.tags.size>0 && !p.tags.some(t=>state.tags.has(t))) return false;
  return true;
}

function sortVal(p,k){
  if(k==="tags") return p.tags.join(",");
  if(k==="remarks") return p.remarks.join(" ");
  return p[k];
}
function compare(a,b){
  const av=sortVal(a,state.sortKey), bv=sortVal(b,state.sortKey);
  let r;
  if(typeof av==="number" && typeof bv==="number") r=av-bv;
  else r=String(av).toLowerCase().localeCompare(String(bv).toLowerCase());
  if(r===0) r=a.id-b.id; // stable-ish tiebreak
  return state.sortDir==="asc" ? r : -r;
}
function onSort(key){
  if(state.sortKey===key){ state.sortDir = state.sortDir==="asc"?"desc":"asc"; }
  else { state.sortKey=key; state.sortDir = (key==="relevance"||key==="year") ? "desc" : "asc"; }
  buildHead(); render();
}

function render(){
  const rows = PAPERS.filter(passes).sort(compare);
  $("#count").innerHTML = `Showing <b>${rows.length}</b> of <b>${PAPERS.length}</b> papers`;
  const body=$("#body"); body.innerHTML="";

  if(rows.length===0){
    const tr=document.createElement("tr");
    tr.innerHTML=`<td class="empty" colspan="${COLS.length}">No papers match the current filters. Try widening the year range, lowering min relevance, or resetting.</td>`;
    body.appendChild(tr);
    return;
  }

  rows.forEach(p=>{
    const tr=document.createElement("tr");
    const st=TOPIC_STYLE[p.topic];
    const rc=relColor(p.relevance);

    // tags
    const tagsHTML = p.tags.length
      ? p.tags.map(t=>`<span class="badge ${tagClass(t)}">${esc(t)}</span>`).join("")
      : `<span class="nobadge">—</span>`;

    // remarks (first 2 visible; rest hidden until expanded)
    const isExp = state.expanded.has(p.id);
    const pts = p.remarks.map((r,i)=>`<div class="rmk-pt${i>=2?" hide":""}">${esc(r)}</div>`).join("");
    const moreN = p.remarks.length-2;
    const toggle = p.remarks.length>2
      ? `<button type="button" class="rmk-toggle" data-id="${p.id}">${isExp?"Show less":"Show "+moreN+" more"}</button>`
      : "";
    const rmkHTML = `<div class="rmk${isExp?" expanded":""}">${pts}${toggle}</div>`;

    // link
    const lk=linkCell(p.link);
    const linkHTML = lk.href
      ? `<a href="${esc(lk.href)}" target="_blank" rel="noopener">${esc(lk.text)}</a>`
      : `<span class="plain">${esc(lk.text)}</span>`;

    tr.innerHTML =
      `<td><div class="rel"><span class="rel-num" style="color:${rc}">${p.relevance}</span>`+
        `<span class="rel-track"><span class="rel-fill" style="width:${p.relevance*10}%;background:${rc}"></span></span></div></td>`+
      `<td class="name">${esc(p.name)}</td>`+
      `<td><span class="topicchip" style="background:${st.bg};color:${st.fg};border-color:${st.bd}">${esc(p.topic)}</span></td>`+
      `<td class="venue">${esc(p.venue)}</td>`+
      `<td class="year">${p.year}</td>`+
      `<td class="tags">${tagsHTML}</td>`+
      `<td class="remarks">${rmkHTML}</td>`+
      `<td class="link">${linkHTML}</td>`;
    body.appendChild(tr);
  });
}

/* per-row remark expand (event delegation, no full re-render) */
$("#body").addEventListener("click",e=>{
  const btn=e.target.closest(".rmk-toggle"); if(!btn) return;
  const id=Number(btn.dataset.id);
  const cont=btn.closest(".rmk");
  const nowExp=!cont.classList.contains("expanded");
  cont.classList.toggle("expanded", nowExp);
  if(nowExp) state.expanded.add(id); else state.expanded.delete(id);
  const moreN = cont.querySelectorAll(".rmk-pt").length-2;
  btn.textContent = nowExp ? "Show less" : "Show "+moreN+" more";
});

/* global expand / collapse all */
$("#expAll").addEventListener("click",()=>{
  const anyCollapsedVisible = PAPERS.some(p=>p.remarks.length>2 && !state.expanded.has(p.id));
  if(anyCollapsedVisible){ PAPERS.forEach(p=>{ if(p.remarks.length>2) state.expanded.add(p.id); }); $("#expAll").textContent="Collapse all remarks"; }
  else { state.expanded.clear(); $("#expAll").textContent="Expand all remarks"; }
  render();
});

/* ============================ FILTER INPUT WIRING ============================ */
$("#search").addEventListener("input",e=>{ state.search=e.target.value.trim().toLowerCase(); render(); });
$("#yearMin").addEventListener("input",e=>{ const v=parseInt(e.target.value,10); state.yMin=isNaN(v)?YMIN:v; render(); });
$("#yearMax").addEventListener("input",e=>{ const v=parseInt(e.target.value,10); state.yMax=isNaN(v)?YMAX:v; render(); });
$("#relMin").addEventListener("input",e=>{ state.relMin=parseInt(e.target.value,10); $("#relVal").textContent=state.relMin; render(); });

$("#reset").addEventListener("click",()=>{
  state.search=""; $("#search").value="";
  state.topics=new Set(TOPIC_ORDER);
  state.venues=new Set(ALL_VENUES);
  state.tags=new Set();
  state.yMin=YMIN; state.yMax=YMAX; $("#yearMin").value=YMIN; $("#yearMax").value=YMAX;
  state.relMin=1; $("#relMin").value=1; $("#relVal").textContent="1";
  state.sortKey="relevance"; state.sortDir="desc";
  state.expanded.clear(); $("#expAll").textContent="Expand all remarks";
  buildHead(); buildTopicChips(); buildTagChips(); buildVenueList(); render();
});

/* ============================ INIT ============================ */
$("#yearMin").value=YMIN; $("#yearMax").value=YMAX;
$("#yearMin").min=YMIN; $("#yearMin").max=YMAX; $("#yearMax").min=YMIN; $("#yearMax").max=YMAX;
buildHead();
buildTopicChips();
buildTagChips();
buildVenueList();
render();
</script>
</body>
</html>
